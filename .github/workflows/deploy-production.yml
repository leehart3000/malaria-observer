name: Deploy to Production

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: malaria-observer
  REGION: europe-west3
  REPO: malaria-observer
  IMAGE: malaria-observer

jobs:
  promote-migrate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set image tag from tagged commit
        run: |
          echo "IMAGE_TAG=git-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/147133052108/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: gha-production-deploy-sa@malaria-observer.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Confirm this image was already built and pushed by staging
        run: |
          gcloud artifacts docker images describe \
            "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ env.IMAGE_TAG }}" \
            --project="${{ env.PROJECT_ID }}" \
            || (echo "::error::No image found for this commit. Push to main and let staging deploy first, then tag that commit." && exit 1)

      - name: Update migration job image
        run: |
          gcloud run jobs update migrate-production \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Run production database migrations
        run: |
          gcloud run jobs execute migrate-production \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --wait

      - name: Deploy to Cloud Run production service
        run: |
          gcloud run deploy malaria-observer-production \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ env.IMAGE_TAG }} \
            --port=8080 \
            --platform=managed \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --service-account=production-cloud-run-sa@malaria-observer.iam.gserviceaccount.com \
            --set-env-vars="^@^DJANGO_SETTINGS_MODULE=malaria_observer.settings.production@GS_BUCKET_NAME=malaria-observer-production-media@GS_PROJECT_ID=malaria-observer@ALLOWED_HOSTS=malaria.observer,www.malaria.observer,malaria-observer-production-147133052108.europe-west3.run.app,malaria-observer-production-oo6ndbprrq-ey.a.run.app@CSRF_TRUSTED_ORIGINS=https://malaria.observer,https://www.malaria.observer,https://malaria-observer-production-147133052108.europe-west3.run.app,https://malaria-observer-production-oo6ndbprrq-ey.a.run.app@ENVIRONMENT=prod@GOOGLE_ANALYTICS_ID=G-MWMS9KYPNW" \
            --set-secrets="DATABASE_URL=production-database-url:latest,SECRET_KEY=production-secret-key:latest,SENTRY_DSN=production-sentry-dsn:latest"