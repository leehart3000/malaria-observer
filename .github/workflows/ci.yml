name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DATABASE_URL: postgres://myproject:myproject@localhost:5432/myproject
  DJANGO_SETTINGS_MODULE: malaria_observer.settings.dev
  SECRET_KEY: dummy-ci-secret-key

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: myproject
          POSTGRES_USER: myproject
          POSTGRES_PASSWORD: myproject
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv with Python 3.13
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Lock file check
        run: uv lock --check

      - name: Ruff checks
        run: uv run ruff check .

      - name: Ruff format checks
        run: uv run ruff format --check .

      - name: Show mypy environment
        run: |
          uv run python --version
          uv run mypy --version
          uv run python -c "import django, mypy_django_plugin; print('Django:', django.get_version()); print('django-stubs plugin:', mypy_django_plugin.__file__)"
          uv tree | grep -E "mypy|django-stubs|django-stubs-ext"

      - name: Mypy checks
        run: uv run mypy .

      - name: Run database migrations
        run: uv run python manage.py migrate

      - name: Pytest tests with coverage
        run: uv run pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}