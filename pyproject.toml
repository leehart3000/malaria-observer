[project]
name = "malaria-observer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.16",
    "django-environ>=0.14.0",
    "django-storages[google]>=1.14.6",
    "gunicorn>=26.1.0",
    "psycopg[binary]>=3.3.4",
    "sentry-sdk>=2.68.0",
    "wagtail>=7.4.3",
    "whitenoise>=6.6.0",
]

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "django-stubs[compatible-mypy]>=6.1.0",
    "factory-boy>=3.3.3",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.2",
    "wagtail-factories>=4.5.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

# Don't lint or format auto-generated database migrations
exclude = [
    "**/migrations/*.py",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort (import sorting)
]
ignore = [
    "E501", # Line too long (Ruff format handles code width; ignoring this stops long comments/strings from breaking builds)
]

[tool.ruff.lint.per-file-ignores]
# Django environments rely on star imports split across base/dev/production files
"*/settings/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "malaria_observer.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--cov --cov-report=term-missing --cov-report=xml --reuse-db"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.13"
show_error_codes = true

check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true

exclude = "(^|/)migrations/"

[[tool.mypy.overrides]]
module = ["malaria_observer.*", "home.*", "search.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["malaria_observer.settings.*"]
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = ["*.tests", "tests.*", "*.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false

[tool.django-stubs]
django_settings_module = "malaria_observer.settings.test"

[tool.coverage.run]
branch = true

source = [
    "malaria_observer",
    "home",
    "search",
]

omit = [
    "*/migrations/*",
    "*/settings/*",
    "*/wsgi.py",
    "*/asgi.py",
    "manage.py",
    "*/tests.py",
    "*/test_*.py",
    "*/*_tests.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80

exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
    "if __name__ == .__main__.:",
]
