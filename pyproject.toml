[project]
name = "malaria-observer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.16",
    "wagtail>=7.4.2",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.0.7",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 88
target-version = "py313"

# Don't lint or format auto-generated database migrations
exclude = [
    "**/migrations/*.py",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort (import sorting)
]
ignore = [
    "E501", # Line too long (Ruff format handles code width; ignoring this stops long comments/strings from breaking builds)
]

[tool.ruff.lint.per-file-ignores]
# Django environments rely on star imports split across base/dev/production files
"*/settings/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "malaria_observer.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.13"
show_error_codes = true

check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true

exclude = "(^|/)migrations/"

[[tool.mypy.overrides]]
module = ["malaria_observer.*", "home.*", "search.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["malaria_observer.settings.*"]
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = ["*.tests", "tests.*", "*.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false

[tool.django-stubs]
django_settings_module = "malaria_observer.settings.dev"
