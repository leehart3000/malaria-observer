<svg
  width="100" height="100"
  viewBox="0 0 100 100"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <mask id="bc1">
      <circle cx="50" cy="50" r="34.5" fill="white" />
      <path
        d="M25.6,82 L25.6,21.4 L50,84.5 L74.4,21.4 L74.4,82"
        fill="none"
        stroke="black"
        stroke-width="7.7"
        stroke-linecap="butt"
        stroke-linejoin="miter"
        stroke-miterlimit="10"
      />
    </mask>
  </defs>

  <!-- Hover fill placeholder — transparent by default -->
  <circle cx="50" cy="50" r="41.9" fill="transparent" />

  <!-- Inner blood-red circle — M punched through via mask -->
  <circle cx="50" cy="50" r="34.5" fill="#8C1010" mask="url(#bc1)" />

  <!-- Outer blood-red ring -->
  <circle cx="50" cy="50" r="45.75" fill="none" stroke="#8C1010" stroke-width="7.5" />
</svg>
