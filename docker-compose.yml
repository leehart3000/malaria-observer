services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: myproject
      POSTGRES_USER: myproject
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://myproject:mypassword@db:5432/myproject
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  postgres_data: