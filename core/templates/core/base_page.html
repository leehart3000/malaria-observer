{% extends "core/layout.html" %}

{% block body %}
<div class="max-w-3xl mx-auto py-10 px-4">
    <h1 class="text-3xl font-bold mb-6">{{ page.title }}</h1>

    {% if page.intro %}
        <div class="prose dark:prose-invert prose-p:text-gray-500 dark:prose-p:text-gray-400">
            {{ page.intro }}
        </div>
    {% endif %}

    {% block content %}{% endblock %}
</div>
{% endblock %}
