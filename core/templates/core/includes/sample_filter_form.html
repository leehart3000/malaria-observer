<div x-data="{ open: {{ filters_open|yesno:'true,false' }} }" class="mb-4">
    <button @click="open = !open" type="button" class="flex items-center gap-2 text-sm font-medium text-gray-700 mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" :class="{ 'rotate-90': open }" class="transition-transform">
            <polyline points="9 18 15 12 9 6"/>
        </svg>
        Filter data
    </button>
    <div x-show="open" x-cloak>
        <form method="get" class="flex flex-wrap gap-3 items-end">
            <input type="hidden" name="filters_open" value="1">
            <input type="hidden" name="set" value="{{ dataset.dataset_id }}">
            {% if request.GET.sort %}<input type="hidden" name="sort" value="{{ request.GET.sort }}">{% endif %}
            {% if request.GET.order %}<input type="hidden" name="order" value="{{ request.GET.order }}">{% endif %}
            {% for field in filter.form %}
                <div class="flex flex-col">
                    <label class="text-xs text-gray-500">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <div class="flex flex-col">
                <label class="text-xs text-gray-500" for="missingness-select">Missingness</label>
                <select id="missingness-select" name="missingness">
                    <option value="" {% if not request.GET.missingness %}selected{% endif %}></option>
                    <option value="with" {% if request.GET.missingness == "with" %}selected{% endif %}>With missingness</option>
                    <option value="without" {% if request.GET.missingness == "without" %}selected{% endif %}>Without missingness</option>
                </select>
            </div>
            {% if show_level_selector %}
                <div class="flex flex-col">
                    <label class="text-xs text-gray-500" for="level-select">Location level</label>
                    <select id="level-select" name="level">
                        <option value="country" {% if current_level == "country" %}selected{% endif %}>Country</option>
                        <option value="admin1" {% if current_level == "admin1" %}selected{% endif %}>Admin level 1</option>
                    </select>
                </div>
            {% endif %}
            <button type="submit" class="bg-blue-600 text-white px-3 py-1 rounded">Apply</button>
            <a href="?{{ reset_query }}" class="bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700">Reset</a>
        </form>
    </div>
</div>
