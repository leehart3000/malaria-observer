{% if dataset %}
    <div class="flex flex-wrap gap-3 mt-4">
        <a href="{% url 'explorer_table' %}?set={{ dataset.dataset_id }}"
           class="inline-flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
            {% include "core/includes/icons/table.html" %}
            View data in table
        </a>
        {% if dataset.has_geographic_data %}
            <a href="{% url 'explorer_geo' %}?set={{ dataset.dataset_id }}"
               class="inline-flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                {% include "core/includes/icons/globe.html" %}
                View data on map
            </a>
        {% endif %}
    </div>
{% endif %}
