{% if dataset %}
    <div class="flex gap-3 mt-4">
        <a href="{% url 'explorer_table' %}?set={{ dataset.dataset_id }}"
           class="inline-flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4"/>
                <path d="M9 3v18"/>
                <path d="M9 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H9"/>
                <path d="M14 9h5"/>
                <path d="M14 14h5"/>
            </svg>
            View data in table
        </a>
        {% if dataset.has_geographic_data %}
            <a href="{% url 'explorer_geo' %}?set={{ dataset.dataset_id }}"
               class="inline-flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
                    <path d="M2 12h20"/>
                </svg>
                View data on map
            </a>
        {% endif %}
    </div>
{% endif %}
