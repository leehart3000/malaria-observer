{% extends "core/layout.html" %}

{% block title %}Map: {{ dataset.name }}{% endblock %}

{% block body %}
<div class="max-w-3xl mx-auto py-16 px-4 text-center">
    <h1 class="text-2xl font-bold mb-2">{{ dataset.name }}</h1>
    <p class="text-gray-600">The map view for this dataset is coming soon.</p>
    <a href="{% url 'explorer_table' %}?set={{ dataset.dataset_id }}" class="inline-block mt-4 text-blue-600">
        View data in table →
    </a>
</div>
{% endblock %}
